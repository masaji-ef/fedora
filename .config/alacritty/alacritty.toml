[env]
TERM = "xterm-256color"

[window]
opacity = 1.0
padding = { x = 2, y = 2 }
dynamic_padding = true
decorations = "none"
resize_increments = false

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 750
blink_timeout = 5

[selection]
save_to_clipboard = true

[terminal]
shell = { program = "/bin/zsh", args = [] }

[font]
size = 16
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[font.glyph_offset]
x = 0
y = 0

# High contrast colors for deuteranopia (matching modular.nvim theme)
[colors]
primary = { background = "#000000", foreground = "#ffffff" }
cursor = { text = "#000000", cursor = "#bb88ff" }

[colors.normal]
black = "#000000"
red = "#ff5555"
green = "#55ff55"
yellow = "#ffdd44"
blue = "#4488ff"
magenta = "#bb88ff"
cyan = "#44ddff"
white = "#ffffff"

[colors.bright]
black = "#0a0a0f"
red = "#ff5555"
green = "#55ff55"
yellow = "#ffdd44"
blue = "#4488ff"
magenta = "#bb88ff"
cyan = "#44ddff"
white = "#ffffff"

[[colors.indexed_colors]]
index = 16
color = "#ffdd44"

[[colors.indexed_colors]]
index = 17
color = "#ff5555"

[hints]
enabled = [
  { regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+",
    command = "xdg-open",
    post_processing = true,
    mouse = { enabled = true },
    binding = { key = "U", mods = "Control|Shift" }
  }
]

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
renderer = "glsl3"
