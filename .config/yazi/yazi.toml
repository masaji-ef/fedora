[mgr]
ratio = [1, 3, 2]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "mtime"
show_hidden = true
show_symlink = true
scrolloff = 10
mouse_events = [ "click", "scroll" ]

[preview]
wrap = "yes"
tab_size = 4
max_width = 800
max_height = 600
cache_dir = "~/.cache/yazi"
image = "chafa"
image_delay = 50
image_filter = "lanczos3"
image_quality = 80
